<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1010" width="1440" height="1010" role="img" aria-labelledby="title description">
<title id="title">Ashlr Universe measured offline demonstration</title>
<desc id="description">Two generations retain compact and readable code variants after seven correctness cases. Compact shrinks from 274 to 47 bytes. Readable shrinks from 317 to 210 bytes. The broken sort variant is rejected in both generations. Arrows show reuse of retained parents. This is a deterministic local demonstration, not measured model engineering yield.</desc>
