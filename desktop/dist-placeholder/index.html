<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ashlr</title>
    <!--
      The Ashlr desktop launch window.

      This is the app's first frame: it opens immediately, says what is
      happening while `ashlr verse` boots, and — if the server never comes up —
      says exactly why and what to do about it. The Verse console itself is
      served by the sidecar at http://127.0.0.1:7777/verse/ in a separate
      window (see src-tauri/src/main.rs).

      State arrives from Rust as `window.__ASHLR_LAUNCH_STATE__` (shape:
      src-tauri/src/launch_state.rs). Button presses go back over the
      `splash-action` event. No token, command, or env value ever reaches this
      page — `launch_state::redact_diagnostic` enforces that on the Rust side.

      Styling follows docs/VERSE-DESIGN-V2.md: neutral ramp, hairlines instead
      of cards, one accent, tight radii, quiet motion. Fonts are the system UI
      stack — there is no network access here and the self-hosted faces live
      behind the sidecar that has not started yet.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --accent-h: 245;
        --accent-s: 72%;
        --accent-l: 58%;
        --accent: hsl(var(--accent-h) var(--accent-s) var(--accent-l));

        --bg-canvas: #fafafa;
        --bg-surface: #ffffff;
        --border-subtle: #ececee;
        --border-default: #e8e8ea;
        --border-strong: #d6d6da;
        --text-primary: #09090b;
        --text-secondary: #52525b;
        --text-tertiary: #71717a;
        --danger: #b42318;

        --radius-sm: 5px;
        --radius-md: 7px;
        --motion: 160ms;

        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      }
      :root[data-theme="dark"] {
        --bg-canvas: #0b0b0d;
        --bg-surface: #121214;
        --border-subtle: #1f1f23;
        --border-default: #2a2a30;
        --border-strong: #3a3a42;
        --text-primary: #f4f4f5;
        --text-secondary: #a1a1aa;
        --text-tertiary: #71717a;
        --danger: #f97066;
        --accent-l: 64%;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg-canvas);
        color: var(--text-primary);
        font: 13px/1.5 var(--font-ui);
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
        overflow: hidden;
      }

      /* The top strip drags the window — the same contract the Verse UI uses. */
      .titlebar {
        height: 32px;
        flex: none;
      }

      .shell {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 0 24px 22px;
      }

      .body {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .mark {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-strong);
        display: grid;
        place-items: center;
        flex: none;
        margin-bottom: 4px;
      }
      .mark span {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        background: var(--accent);
        transition: opacity var(--motion) ease-out;
      }
      [data-phase="starting"] .mark span { animation: pulse 1400ms ease-in-out infinite; }
      [data-phase="failed"] .mark { border-color: var(--danger); }
      [data-phase="failed"] .mark span { background: var(--danger); }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) {
        .mark span { animation: none !important; }
        * { transition-duration: 1ms !important; }
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .message { margin: 0; color: var(--text-secondary); }
      .hint {
        margin: 0;
        color: var(--text-tertiary);
        border-left: 2px solid var(--border-strong);
        padding-left: 10px;
      }
      /* Commands the user is meant to type. The Rust strings mark them with
         backticks (src-tauri/src/launch_state.rs); rendering them as literal
         backticks reads like a typo, so they become real inline code. */
      .hint code {
        font: 11.5px/1.4 var(--font-mono);
        color: var(--text-secondary);
        background: var(--bg-surface);
        border: 1px solid var(--border-default);
        border-radius: 3px;
        padding: 0 4px;
        user-select: text;
        cursor: text;
        white-space: nowrap;
      }

      /* Indeterminate hairline, not a spinner. */
      .progress {
        height: 2px;
        background: var(--border-subtle);
        overflow: hidden;
        flex: none;
      }
      .progress i {
        display: block;
        height: 100%;
        width: 35%;
        background: var(--accent);
        animation: slide 1400ms ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(340%); }
      }

      .detail {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        background: var(--bg-surface);
        padding: 8px 10px;
        font: 11px/1.55 var(--font-mono);
        color: var(--text-secondary);
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        cursor: text;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        flex: none;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        background: transparent;
        color: var(--text-primary);
        cursor: pointer;
        transition: background var(--motion) ease-out, border-color var(--motion) ease-out;
      }
      button:hover { border-color: var(--text-tertiary); }
      button[data-primary="true"] {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }
      button[data-primary="true"]:hover { filter: brightness(1.08); }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body data-phase="starting">
    <div class="shell">
      <div class="titlebar" data-tauri-drag-region="deep"></div>
      <div class="body">
        <div class="mark" aria-hidden="true"><span></span></div>
        <h1 id="headline">Starting Ashlr Verse</h1>
        <p class="message" id="message">Bringing up the local server on 127.0.0.1:7777.</p>
        <div class="progress" id="progress" role="progressbar" aria-label="Starting"><i></i></div>
        <p class="hint" id="hint" hidden></p>
        <div class="detail" id="detail" hidden></div>
      </div>
      <div class="actions" id="actions"></div>
    </div>

    <script>
      (function () {
        // Theme is decided natively (saved UI theme, else the OS) and injected
        // before this script runs, so the window never flashes the wrong ground.
        var injected = window.__ASHLR_LAUNCH_THEME__;
        var dark =
          injected === 'dark' ||
          (injected !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

        var el = {
          body: document.body,
          headline: document.getElementById('headline'),
          message: document.getElementById('message'),
          hint: document.getElementById('hint'),
          detail: document.getElementById('detail'),
          progress: document.getElementById('progress'),
          actions: document.getElementById('actions')
        };

        function emit(action) {
          var internals = window.__TAURI_INTERNALS__;
          if (!internals || typeof internals.invoke !== 'function') return;
          try {
            internals.invoke('plugin:event|emit', {
              event: 'splash-action',
              payload: action
            });
          } catch (_) {}
        }

        // Split on backtick pairs and build text/<code> nodes. Deliberately
        // node-by-node rather than innerHTML: the hint is native-authored, but
        // nothing on this page should be able to turn a string into markup.
        function renderHint(text) {
          el.hint.textContent = '';
          var parts = String(text).split('`');
          for (var i = 0; i < parts.length; i++) {
            if (parts[i] === '') continue;
            // Odd indices sit between a pair of backticks — unless the string
            // has an unmatched one, in which case the tail stays plain text.
            var isCode = i % 2 === 1 && i < parts.length - 1;
            var node = isCode ? document.createElement('code') : null;
            if (node) {
              node.textContent = parts[i];
              el.hint.appendChild(node);
            } else {
              el.hint.appendChild(document.createTextNode(parts[i]));
            }
          }
        }

        function render(state) {
          if (!state || typeof state !== 'object') return;
          el.body.setAttribute('data-phase', String(state.phase || 'starting'));
          el.headline.textContent = state.headline || '';
          el.message.textContent = state.message || '';

          renderHint(state.hint || '');
          el.hint.hidden = !state.hint;

          var detail = Array.isArray(state.detail) ? state.detail : [];
          el.detail.textContent = detail.join('\n');
          el.detail.hidden = detail.length === 0;

          el.progress.hidden = state.phase !== 'starting';

          el.actions.textContent = '';
          var actions = Array.isArray(state.actions) ? state.actions : [];
          for (var i = 0; i < actions.length; i++) {
            (function (action) {
              var button = document.createElement('button');
              button.type = 'button';
              button.textContent = action.label;
              if (action.primary) button.setAttribute('data-primary', 'true');
              button.addEventListener('click', function () {
                emit(action.id);
              });
              el.actions.appendChild(button);
            })(actions[i]);
          }
          if (actions.length) el.actions.firstChild.focus();
        }

        // Rust pushes state by defining __ASHLR_LAUNCH_STATE__ and calling this.
        window.__ashlrRenderLaunch = render;

        // …and because an eval can land before this document finished parsing,
        // the first few seconds are also polled. Cheap, and it removes the race
        // entirely rather than hoping about it.
        var last = '';
        function poll() {
          var state = window.__ASHLR_LAUNCH_STATE__;
          if (!state) return;
          var serialized = JSON.stringify(state);
          if (serialized === last) return;
          last = serialized;
          render(state);
        }
        poll();
        setInterval(poll, 150);
      })();
    </script>
  </body>
</html>
