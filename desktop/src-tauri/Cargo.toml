[package]
name = "ashlr-desktop"
version = "3.25.2"
description = "Ashlr Mission Control — desktop wrapper"
authors = ["Mason Wyatt <mason@evero-consulting.com>"]
license = "MIT"
repository = "https://github.com/your-org/ashlr-hub"
edition = "2021"
rust-version = "1.77"
build = "build.rs"

# Suppress Tauri's default binary name so we can use our own.
[[bin]]
name = "ashlr-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
    "tray-icon",
    "image-png",
] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
# Native file/directory chooser. Used by exactly one thing: the Verse
# "Open folder…" button, which needs a real macOS/Windows/Linux directory
# picker instead of asking the operator to type an absolute path. Only
# `dialog:allow-open` is granted, and only to the remote Verse origin —
# see capabilities/verse-remote.json.
tauri-plugin-dialog = "2"
# Native notifications (turn finished / failed, "Needs you", seat health).
# Driven from RUST ONLY: the Verse page gets no `notification:*` permission
# (capabilities/verse-remote.json is unchanged), so page code can never raise
# a notification or choose its text — `notify.rs` renders every word from its
# own templates. Unsigned builds fall back to osascript (see notify.rs).
tauri-plugin-notification = "2"
# The optional system-wide "show Verse" hotkey (⌃⌥Space, off by default,
# toggled in Settings ▸ Desktop). Registered from Rust only; the plugin's IPC
# commands are not granted to any window, so the page can ask for the hotkey
# to be switched on or off but never register a key of its own.
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
# Reuse the exact updater-locked packages for bounded streaming and the paired signature.
minisign-verify = "=0.2.5"
futures-util = { version = "=0.3.32", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["stream", "rustls-no-provider"] }

# `libc` was already a macOS dependency; the target is widened to every unix so
# `sidecar_guard`'s `kill(2)` / signal handling compiles on Linux too (the Linux
# BUNDLE stays quarantined — see scripts/assert-desktop-bundle-policy.mjs — but
# the crate must still build there).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The browser pane's screenshot (`browser_pane.rs`, macOS only):
# `WKWebView takeSnapshotWithConfiguration:` → NSImage → PNG/JPEG → base64, and
# showing a tab window without stealing focus (`NSWindow addChildWindow:` +
# `orderFront:`). Every crate here is already in Cargo.lock as a wry/tao
# dependency at these exact versions — this adds root edges, not packages —
# and default features are off so nothing new is compiled in.
#
# Computer use (`computer.rs`, macOS only) adds FEATURES of the same crates, not
# crates: NSWorkspace / NSRunningApplication (which app is where), NSScreen /
# NSColor / NSView / NSControl / NSTextField / NSText / NSFont (the HUD border and
# pill), NSArray / NSGeometry / NSURL. Accessibility, CoreGraphics events and
# CoreFoundation are hand-declared `extern "C"`; ScreenCaptureKit is loaded with
# dlopen at first use (never linked — the minimum macOS predates it).
# The browser pane's native half (`browser_pane.rs` / `browser_input.rs`, macOS
# only):
# - screenshots: `WKWebView takeSnapshotWithConfiguration:` (with a clip rect —
#   hence objc2-web-kit's `objc2-core-foundation` for `CGRect`) → NSImage →
#   PNG/JPEG → base64;
# - showing a tab window without stealing focus (`NSWindow addChildWindow:` +
#   `orderFront:`);
# - acting: synthesizing TRUSTED input into our OWN tab WKWebView —
#   `NSEvent mouseEventWithType:…` / `keyEventWithType:…` (`NSEvent`,
#   `NSGraphicsContext` for the unused context argument, `NSView` for point
#   conversion) delivered with `NSWindow sendEvent:`. No Accessibility
#   permission and no `CGEventPost`: nothing reaches the window server or any
#   other app;
# - operator takeover: one `NSEvent addLocalMonitorForEventsMatchingMask:`
#   (`block2`) that sees only genuine input;
# - no microphone / camera for a page (`media_guard.rs`: a `WKUIDelegate`
#   deny proxy, reading `WKFrameInfo` / `WKSecurityOrigin`).
# Every crate here is already in Cargo.lock as a wry/tao dependency at these
# exact versions — this adds root edges and features, not packages — and
# default features are off so nothing new is compiled in.

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
base64 = "0.22.1"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSProcessInfo",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSBitmapImageRep",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSEvent",

    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSText",
    "NSTextField",

    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKFrameInfo",
    "WKSecurityOrigin",
    "objc2-core-foundation",
    "WKSnapshotConfiguration",
    "WKUIDelegate",
    "WKWebView",
] }
# Dictation (`src/voice/`), macOS only — the app captures the microphone
# itself (the launchd sidecar has no UI and cannot hold a TCC grant):
# - `cpal`: CoreAudio input stream, downmixed and resampled to 16 kHz mono.
# - `transcribe-rs` (`onnx`): NVIDIA Parakeet TDT 0.6B v3 (int8 ONNX) through
#   ONNX Runtime. The model (~670 MB) is NOT bundled: it is downloaded on
#   first use into the app-support dir and SHA-256 verified
#   (`voice/model.rs`). ONNX Runtime itself is linked statically; `ort-sys`
#   fetches its prebuilt, hash-pinned static library at BUILD time (network
#   needed on a cold cache, cached under ~/Library/Caches/ort.pyke.io).
cpal = "0.18.2"
transcribe-rs = { version = "0.3.11", default-features = false, features = ["onnx"] }

[profile.release]
# Produce a smaller binary: strip debug info, enable LTO, single codegen unit.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
