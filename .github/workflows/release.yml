# release.yml — tag-triggered npm publish + GitHub release (M33).
#
# Trigger: pushing a tag `v<X.Y.Z>`. Nothing publishes without that explicit
# human action, and the verify job reuses the exact native CI matrix first.
#
# npm trusted-publisher setup is required for @ashlr/hub and must bind this
# public repository to release.yml. No long-lived npm write token is used.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    name: Verify (full native CI gate)
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm + GitHub release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write   # gh release create
      id-token: write   # npm --provenance
    steps:
      - name: Checkout the immutable tag target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Admit only commits from protected master history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag_commit="$(git rev-parse --verify "${GITHUB_REF}^{commit}")"
          head_commit="$(git rev-parse --verify "HEAD^{commit}")"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Release tag target does not match the checked-out commit." >&2
            exit 1
          fi

          branch_json="$(gh api --fail "repos/${GITHUB_REPOSITORY}/branches/master")"
          master_protected="$(jq -r '.protected // false' <<<"$branch_json")"
          master_commit="$(jq -r '.commit.sha // empty' <<<"$branch_json")"
          if [[ "$master_protected" != "true" || ! "$master_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Protected master authority could not be established." >&2
            exit 1
          fi

          comparison="$(gh api --fail \
            "repos/${GITHUB_REPOSITORY}/compare/${tag_commit}...${master_commit}" \
            --jq '.status')"
          if [[ "$comparison" != "ahead" && "$comparison" != "identical" ]]; then
            echo "Release tag target is not in protected master history." >&2
            exit 1
          fi
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # npm trusted publishing requires npm >=11.5.1. Pin the release client
      # so a hosted image's bundled npm version cannot silently change auth.
      - name: Install pinned trusted-publishing npm CLI
        run: npm install --global npm@11.15.0 --ignore-scripts --no-audit --no-fund
      - name: Verify trusted-publishing npm CLI
        run: test "$(npm --version)" = "11.15.0"
      - run: npm ci
      - run: npm run build
      - name: Tag must match package.json version
        run: node scripts/check-version.mjs
      - name: Extract release notes from CHANGELOG.md
        run: node scripts/extract-changelog.mjs > release-notes.md
      - name: Publish to npm (provenance)
        run: npm publish --provenance --access public
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
