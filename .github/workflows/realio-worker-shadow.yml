name: Real-I/O worker experiment (advisory)

# Manual measurement only. Never add this job to required release checks.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realio-worker-shadow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: Real-I/O worker experiment (no qualification authority)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up existing CI Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Bind dispatched source
        env:
          ASHLR_CANDIDATE_SHA: ${{ github.sha }}
        run: node .github/scripts/ci-source-binding.mjs

      - name: Install locked dependencies once
        run: npm ci --no-audit --no-fund

      - name: Build matching source once
        run: npm run build

      - name: Compare identical whole modules without retries
        id: experiment
        env:
          ASHLR_CANDIDATE_SHA: ${{ github.sha }}
        run: node .github/scripts/ci-realio-worker-shadow.mjs

      - name: Upload only numeric advisory measurements
        if: always() && steps.experiment.outputs.numeric_dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phantom-realio-worker-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.experiment.outputs.numeric_dir }}/measurements.json
          if-no-files-found: error
          retention-days: 7

      - name: State advisory scope
        if: always()
        run: echo 'Manual 82-case experiment only; no release admission, result reuse or full-suite speed claim.' >> "$GITHUB_STEP_SUMMARY"
