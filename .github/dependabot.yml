version: 2

# GitHub-hosted update jobs are intentionally disabled while repository
# verification and dependency maintenance run through the local fleet. Restore
# the prior bounded limits only after Actions capacity is explicitly available.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:17"
      timezone: America/New_York
    open-pull-requests-limit: 0
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /src/raycast
    schedule:
      interval: weekly
      day: monday
      time: "09:17"
      timezone: America/New_York
    open-pull-requests-limit: 0
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:17"
      timezone: America/New_York
    open-pull-requests-limit: 0
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
